<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="only light"><meta name="theme-color" content="#F5EFE3"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>碰碰 · 会面提案</title><style>
:root{
  --paper-bg:#F5EFE3;
  --paper-card:#FFFCF5;
  --paper-ink:#4A2C16;
  --paper-ink-soft:#75624F;
  --paper-khaki:#C7AD86;
  --paper-line:#D9C8AC;
  --accent-sage:#5E7158;
  --primary:#765033;
  --primary-weak:#EEE1CA;
  --text:var(--paper-ink);
  --text-2:var(--paper-ink-soft);
  --text-3:#88755F;
  --line:var(--paper-line);
  --paper-shadow:0 2px 5px rgba(74,44,22,.05);
  --radius-paper:6px 9px 5px 8px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper-bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Helvetica Neue",sans-serif}
body{padding:calc(14px + var(--safe-top)) 0 calc(20px + var(--safe-bottom));font-size:14px;line-height:1.5}
.wrap{width:min(100%,480px);margin:0 auto}
.brand{padding:2px 16px 12px;font-size:12px;color:var(--paper-ink-soft);font-weight:700;letter-spacing:.03em}
.card{background:var(--paper-card);border:1px solid var(--line);border-bottom:2px dashed var(--line);border-radius:3px;box-shadow:var(--paper-shadow);overflow:hidden}
.hero{padding:18px 16px 15px;background:var(--primary-weak);border-bottom:1px dashed var(--line)}
.name{font-size:20px;line-height:1.35;font-weight:800;margin:0 0 8px;color:var(--paper-ink)}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11.5px;color:var(--text-2)}
.pill{padding:2px 7px;border:1px solid var(--line);border-radius:3px;background:var(--paper-card)}
.body{padding:14px 16px 18px;background:var(--paper-card)}
.address{font-size:12.5px;line-height:1.6;margin:0 0 12px;color:var(--text-2)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 18px}
.stat{padding:10px 11px;border:1px solid var(--line);border-radius:var(--radius-paper);background:var(--paper-card);box-shadow:0 1px 2px rgba(74,44,22,.05)}
.stat b{display:block;font-size:17px;line-height:1.2;color:var(--paper-ink)}
.stat span{display:block;margin-top:3px;font-size:11px;color:var(--text-3)}
.section{margin-top:18px}
.section h2{font-size:14.5px;margin:0 0 10px;color:var(--paper-ink)}
.commute{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--line);background:var(--paper-card);font-size:12px}
.commute:first-of-type{border-radius:var(--radius-paper) var(--radius-paper) 0 0}
.commute:last-of-type{border-radius:0 0 var(--radius-paper) var(--radius-paper)}
.commute+.commute{border-top:0}
.commute-name{min-width:0;flex:1;font-weight:600;color:var(--paper-ink)}
.commute-mode{font-size:11px;color:var(--text-3)}
.commute-time{font-weight:700;color:var(--paper-ink)}
.tip{font-size:12.5px;line-height:1.65;padding:11px 12px;background:#edf0e6;border:1px solid #b4bea7;border-left:3px solid var(--accent-sage);border-radius:3px 8px 4px 6px;color:#4d5e46}
.info{display:grid;gap:7px;padding:10px 11px;border:1px solid var(--line);border-radius:var(--radius-paper);font-size:12px;line-height:1.55;color:var(--text-2)}
.tags{display:flex;flex-wrap:wrap;gap:5px;padding-top:2px}
.tag{font-size:10.5px;padding:2px 7px;border:1px solid var(--line);border-radius:3px;background:var(--primary-weak);color:var(--paper-ink)}
.nav{display:block;width:100%;margin-top:18px;padding:12px 14px;text-align:center;text-decoration:none;color:#fff;background:var(--primary);border:1px solid var(--paper-ink);border-radius:var(--radius-paper);box-shadow:2px 3px 0 var(--paper-khaki);font-weight:700;font-size:13px}
.nav:active{transform:translateY(2px);box-shadow:1px 1px 0 var(--paper-khaki)}
.foot{text-align:center;font-size:12px;color:var(--paper-ink-soft);margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.invalid{padding:34px 22px;text-align:center;background:var(--paper-card)}
.invalid h1{font-size:18px;color:var(--paper-ink)}
.invalid p{font-size:12px;color:var(--text-2);line-height:1.7}
.loading{padding:44px 20px;text-align:center;font-size:13px;color:var(--text-2);background:var(--paper-card)}
@media(min-width:520px){body{padding-top:28px}.wrap{border-left:1px solid rgba(217,200,172,.45);border-right:1px solid rgba(217,200,172,.45)}}
</style></head><body><main class="wrap"><div class="brand">碰碰 · 想见，那就轻松碰一面</div><div id="app" class="card"><div class="loading">正在打开会面提案…</div></div></main><script>
const MODES=["transit","drive","taxi","bike","walk"],MODE_LABEL={transit:"公交",drive:"驾车",taxi:"打车",bike:"骑行",walk:"步行"};
const LZ={decompressFromEncodedURIComponent:function(s){return null==s?"":""===s?null:(s=s.replace(/ /g,"+"),this._d(s.length,32,i=>this._v(s.charAt(i))))},_v:function(c){const k="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+-$",i=k.indexOf(c);return i<0?0:i},_d:function(length,reset,get){const dict=[0,1,2];let enlarge=4,dictSize=4,numBits=3,entry="",result=[],data={val:get(0),position:reset,index:1},bits=0,max=4,power=1,resb;while(power!==max){resb=data.val&data.position;data.position>>=1;if(data.position===0){data.position=reset;data.val=get(data.index++)}bits|=(resb>0?1:0)*power;power<<=1}let next=bits,c;switch(next){case 0:bits=0;max=256;power=1;while(power!==max){resb=data.val&data.position;data.position>>=1;if(data.position===0){data.position=reset;data.val=get(data.index++)}bits|=(resb>0?1:0)*power;power<<=1}c=String.fromCharCode(bits);break;case 1:bits=0;max=65536;power=1;while(power!==max){resb=data.val&data.position;data.position>>=1;if(data.position===0){data.position=reset;data.val=get(data.index++)}bits|=(resb>0?1:0)*power;power<<=1}c=String.fromCharCode(bits);break;case 2:return""}dict[3]=c;let w=c;result.push(c);for(;;){if(data.index>length)return"";bits=0;max=1<<numBits;power=1;while(power!==max){resb=data.val&data.position;data.position>>=1;if(data.position===0){data.position=reset;data.val=get(data.index++)}bits|=(resb>0?1:0)*power;power<<=1}let cc=bits;switch(cc){case 0:bits=0;max=256;power=1;while(power!==max){resb=data.val&data.position;data.position>>=1;if(data.position===0){data.position=reset;data.val=get(data.index++)}bits|=(resb>0?1:0)*power;power<<=1}dict[dictSize++]=String.fromCharCode(bits);cc=dictSize-1;enlarge--;break;case 1:bits=0;max=65536;power=1;while(power!==max){resb=data.val&data.position;data.position>>=1;if(data.position===0){data.position=reset;data.val=get(data.index++)}bits|=(resb>0?1:0)*power;power<<=1}dict[dictSize++]=String.fromCharCode(bits);cc=dictSize-1;enlarge--;break;case 2:return result.join("")}if(enlarge===0){enlarge=1<<numBits;numBits++}if(dict[cc])entry=dict[cc];else{if(cc!==dictSize)return null;entry=w+w.charAt(0)}result.push(entry);dict[dictSize++]=w+entry.charAt(0);enlarge--;w=entry;if(enlarge===0){enlarge=1<<numBits;numBits++}}}};
function b64json(s){s=s.replace(/-/g,"+").replace(/_/g,"/");s+="=".repeat((4-s.length%4)%4);const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return JSON.parse(new TextDecoder("utf-8",{fatal:true}).decode(u))}
function unpack(n){if(!Array.isArray(n)||![2,3].includes(n[0])||!Array.isArray(n[1])||n[1].length!==15||!Array.isArray(n[2]))return null;const s=n[1];return{version:1,shop:{name:s[0],city:s[1],area:s[2],address:s[3],lng:s[4],lat:s[5],rating:s[6],perCapita:s[7],primary:s[8],sub:s[9],category:s[10],intro:s[11],hours:s[12],phone:s[13],tags:s[14]},commutes:n[2].map(x=>({name:x[0],mode:MODES[x[1]],minutes:x[2],fare:x[3],count:x[4]})),avgMinutes:n[3],timeDiffMinutes:n[4],tip:n[5],createdAt:n[6]}}
function parse(raw){try{if(raw.startsWith("v4.")){const n=b64json(raw.slice(3));if(!Array.isArray(n)||n[0]!==4||!Array.isArray(n[1])||n[1].length!==9||!Array.isArray(n[2]))return null;const s=n[1];return{version:1,shop:{name:s[0],city:s[1],area:s[2],address:s[3],lng:s[4],lat:s[5],rating:s[6],perCapita:s[7],category:s[8],primary:"",sub:"",intro:"",hours:"",phone:"",tags:[]},commutes:n[2].map(x=>({name:x[0],mode:MODES[x[1]],minutes:x[2],fare:x[3],count:x[4]})),avgMinutes:n[3],timeDiffMinutes:n[4],tip:null,createdAt:n[5]}}if(raw.startsWith("v3."))return unpack(b64json(raw.slice(3)));if(raw.startsWith("v2.")){const t=LZ.decompressFromEncodedURIComponent(raw.slice(3));return t?unpack(JSON.parse(t)):null}return b64json(raw)}catch(e){return null}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function valid(p){return p&&p.shop&&p.shop.name&&Number.isFinite(+p.shop.lat)&&Number.isFinite(+p.shop.lng)&&Array.isArray(p.commutes)&&p.commutes.length>0}
function money(v){return Number.isFinite(+v)&&+v>0?`¥${Math.round(+v)}`:"暂无人均"}function rating(v){return Number.isFinite(+v)&&+v>0?`★ ${(+v).toFixed(1)}`:"暂无评分"}
function render(p){const s=p.shop,tags=Array.isArray(s.tags)?s.tags:[],com=p.commutes||[];const nav=`https://api.map.baidu.com/marker?location=${encodeURIComponent(s.lat)},${encodeURIComponent(s.lng)}&title=${encodeURIComponent(s.name||"")}&content=${encodeURIComponent(s.address||"")}&output=html&src=webapp.pengpeng`;document.title=`${s.name||"会面提案"} · 碰碰`;document.getElementById("app").innerHTML=`<section class="hero"><h1 class="name">${esc(s.name)}</h1><div class="meta"><span class="pill">${esc(rating(s.rating))}</span><span class="pill">${esc(money(s.perCapita))}</span>${s.category?`<span class="pill">${esc(s.category)}</span>`:""}${s.area?`<span class="pill">${esc(s.area)}</span>`:""}</div></section><section class="body">${s.address?`<p class="address">${esc(s.address)}</p>`:""}<div class="stats"><div class="stat"><b>约${esc(Math.round(+p.avgMinutes||0))}分钟</b><span>平均通勤</span></div><div class="stat"><b>${esc(Math.round(+p.timeDiffMinutes||0))}分钟</b><span>时间差</span></div></div><div class="section"><h2>大家怎么到</h2>${com.map(x=>`<div class="commute"><span class="commute-name">${esc(x.name)}${+x.count>1?` ×${esc(x.count)}`:""}</span><span class="commute-mode">${esc(MODE_LABEL[x.mode]||x.mode||"")}</span><span class="commute-time">${esc(Math.round(+x.minutes||0))} 分钟</span></div>`).join("")}</div>${p.tip?`<div class="section"><h2>✨ 碰碰小tip</h2><div class="tip">${esc(p.tip)}</div></div>`:""}${(s.hours||s.phone||tags.length)?`<div class="section"><h2>店铺信息</h2><div class="info">${s.hours?`<div>营业时间　${esc(s.hours)}</div>`:""}${s.phone?`<div>联系电话　${esc(s.phone)}</div>`:""}${tags.length?`<div class="tags">${tags.slice(0,4).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>`:""}</div></div>`:""}<a class="nav" href="${nav}" target="_blank" rel="noopener">在地图中查看</a><div class="foot">碰碰 · 想见，那就轻松碰一面</div></section>`}
const raw=location.hash.startsWith("#/share/")?location.hash.slice(8):location.hash.replace(/^#/,"");const p=parse(raw);if(valid(p))render(p);else document.getElementById("app").innerHTML='<section class="invalid"><h1>这份会面提案链接无效或不完整</h1><p>请让碰友重新分享一次，或检查链接是否被聊天软件截断。</p></section>';
</script></body></html>
