<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="only light"><meta name="theme-color" content="#F5EFE3"><title>碰碰 · 会面提案</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#ded5c5;color:#29241f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}body{padding:18px 14px 34px}.wrap{max-width:560px;margin:0 auto}.brand{font-size:13px;font-weight:800;letter-spacing:.08em;margin:4px 4px 12px;color:#7f6d58}.card{background:#fffaf1;border:1px solid #40372e;border-radius:18px;box-shadow:4px 5px 0 #b6a58d;overflow:hidden}.hero{padding:22px 20px 18px;background:linear-gradient(145deg,#f7e4b3,#f5efe3 58%,#f8d8bd)}.name{font-size:24px;line-height:1.3;font-weight:900;margin:0 0 10px}.meta{display:flex;flex-wrap:wrap;gap:8px;font-size:13px}.pill{padding:5px 9px;border:1px solid #67594c;border-radius:999px;background:#fffaf1}.body{padding:18px 20px 22px}.address{font-size:14px;line-height:1.65;margin:0 0 14px;color:#5c5146}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.stat{padding:13px 14px;border:1px solid #c8b8a1;border-radius:14px;background:#f6efe4}.stat b{display:block;font-size:22px;line-height:1.1}.stat span{display:block;margin-top:5px;font-size:12px;color:#7d6f61}.section{margin-top:18px}.section h2{font-size:15px;margin:0 0 10px}.commute{display:flex;align-items:center;gap:8px;padding:11px 12px;border:1px solid #d6c8b5;border-radius:12px;background:#fff}.commute+.commute{margin-top:8px}.commute-name{min-width:0;flex:1;font-weight:700}.commute-mode{font-size:12px;color:#75685c}.commute-time{font-weight:900}.tip{font-size:13px;line-height:1.65;padding:12px 13px;border:1px dashed #b49d7f;border-radius:12px;background:#fff8e8}.info{display:grid;gap:7px;font-size:13px;line-height:1.55;color:#62564a}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:12px;padding:4px 8px;border-radius:999px;background:#eee2d0}.nav{display:block;width:100%;margin-top:20px;padding:13px 16px;text-align:center;text-decoration:none;color:#fff;background:#ef7c46;border:1px solid #40372e;border-radius:13px;box-shadow:2px 3px 0 #b6a58d;font-weight:800}.foot{text-align:center;font-size:12px;color:#8b7c6c;margin-top:14px}.invalid{padding:34px 22px;text-align:center}.invalid h1{font-size:19px}.invalid p{font-size:13px;color:#75685c;line-height:1.7}.loading{padding:44px 20px;text-align:center;font-size:14px;color:#766a5d}@media(min-width:700px){body{padding-top:34px}}
</style></head><body><main class="wrap"><div class="brand">碰碰 · 想见，那就轻松碰一面</div><div id="app" class="card"><div class="loading">正在打开会面提案…</div></div></main><script>
const MODES=["transit","drive","taxi","bike","walk"],MODE_LABEL={transit:"公交",drive:"驾车",taxi:"打车",bike:"骑行",walk:"步行"};
const LZ={decompressFromEncodedURIComponent:function(s){return null==s?"":""===s?null:(s=s.replace(/ /g,"+"),this._d(s.length,32,i=>this._v(s.charAt(i))))},_v:function(c){const k="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+-$",i=k.indexOf(c);return i<0?0:i},_d:function(length,reset,get){const dict=[0,1,2];let enlarge=4,dictSize=4,numBits=3,entry="",result=[],data={val:get(0),position:reset,index:1},bits=0,max=4,power=1,resb;while(power!==max){resb=data.val&data.position;data.position>>=1;if(data.position===0){data.position=reset;data.val=get(data.index++)}bits|=(resb>0?1:0)*power;power<<=1}let next=bits,c;switch(next){case 0:bits=0;max=256;power=1;while(power!==max){resb=data.val&data.position;data.position>>=1;if(data.position===0){data.position=reset;data.val=get(data.index++)}bits|=(resb>0?1:0)*power;power<<=1}c=String.fromCharCode(bits);break;case 1:bits=0;max=65536;power=1;while(power!==max){resb=data.val&data.position;data.position>>=1;if(data.position===0){data.position=reset;data.val=get(data.index++)}bits|=(resb>0?1:0)*power;power<<=1}c=String.fromCharCode(bits);break;case 2:return""}dict[3]=c;let w=c;result.push(c);for(;;){if(data.index>length)return"";bits=0;max=1<<numBits;power=1;while(power!==max){resb=data.val&data.position;data.position>>=1;if(data.position===0){data.position=reset;data.val=get(data.index++)}bits|=(resb>0?1:0)*power;power<<=1}let cc=bits;switch(cc){case 0:bits=0;max=256;power=1;while(power!==max){resb=data.val&data.position;data.position>>=1;if(data.position===0){data.position=reset;data.val=get(data.index++)}bits|=(resb>0?1:0)*power;power<<=1}dict[dictSize++]=String.fromCharCode(bits);cc=dictSize-1;enlarge--;break;case 1:bits=0;max=65536;power=1;while(power!==max){resb=data.val&data.position;data.position>>=1;if(data.position===0){data.position=reset;data.val=get(data.index++)}bits|=(resb>0?1:0)*power;power<<=1}dict[dictSize++]=String.fromCharCode(bits);cc=dictSize-1;enlarge--;break;case 2:return result.join("")}if(enlarge===0){enlarge=1<<numBits;numBits++}if(dict[cc])entry=dict[cc];else{if(cc!==dictSize)return null;entry=w+w.charAt(0)}result.push(entry);dict[dictSize++]=w+entry.charAt(0);enlarge--;w=entry;if(enlarge===0){enlarge=1<<numBits;numBits++}}}};
function b64json(s){s=s.replace(/-/g,"+").replace(/_/g,"/");s+="=".repeat((4-s.length%4)%4);const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return JSON.parse(new TextDecoder("utf-8",{fatal:true}).decode(u))}
function unpack(n){if(!Array.isArray(n)||![2,3].includes(n[0])||!Array.isArray(n[1])||n[1].length!==15||!Array.isArray(n[2]))return null;const s=n[1];return{version:1,shop:{name:s[0],city:s[1],area:s[2],address:s[3],lng:s[4],lat:s[5],rating:s[6],perCapita:s[7],primary:s[8],sub:s[9],category:s[10],intro:s[11],hours:s[12],phone:s[13],tags:s[14]},commutes:n[2].map(x=>({name:x[0],mode:MODES[x[1]],minutes:x[2],fare:x[3],count:x[4]})),avgMinutes:n[3],timeDiffMinutes:n[4],tip:n[5],createdAt:n[6]}}
function parse(raw){try{if(raw.startsWith("v3."))return unpack(b64json(raw.slice(3)));if(raw.startsWith("v2.")){const t=LZ.decompressFromEncodedURIComponent(raw.slice(3));return t?unpack(JSON.parse(t)):null}return b64json(raw)}catch(e){return null}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function valid(p){return p&&p.shop&&p.shop.name&&Number.isFinite(+p.shop.lat)&&Number.isFinite(+p.shop.lng)&&Array.isArray(p.commutes)&&p.commutes.length>0}
function money(v){return Number.isFinite(+v)&&+v>0?`¥${Math.round(+v)}`:"暂无人均"}function rating(v){return Number.isFinite(+v)&&+v>0?`★ ${(+v).toFixed(1)}`:"暂无评分"}
function render(p){const s=p.shop,tags=Array.isArray(s.tags)?s.tags:[],com=p.commutes||[];const nav=`https://api.map.baidu.com/marker?location=${encodeURIComponent(s.lat)},${encodeURIComponent(s.lng)}&title=${encodeURIComponent(s.name||"")}&content=${encodeURIComponent(s.address||"")}&output=html&src=webapp.pengpeng`;document.title=`${s.name||"会面提案"} · 碰碰`;document.getElementById("app").innerHTML=`<section class="hero"><h1 class="name">${esc(s.name)}</h1><div class="meta"><span class="pill">${esc(rating(s.rating))}</span><span class="pill">${esc(money(s.perCapita))}</span>${s.category?`<span class="pill">${esc(s.category)}</span>`:""}${s.area?`<span class="pill">${esc(s.area)}</span>`:""}</div></section><section class="body">${s.address?`<p class="address">${esc(s.address)}</p>`:""}<div class="stats"><div class="stat"><b>约${esc(Math.round(+p.avgMinutes||0))}分钟</b><span>平均通勤</span></div><div class="stat"><b>${esc(Math.round(+p.timeDiffMinutes||0))}分钟</b><span>时间差</span></div></div><div class="section"><h2>大家怎么到</h2>${com.map(x=>`<div class="commute"><span class="commute-name">${esc(x.name)}${+x.count>1?` ×${esc(x.count)}`:""}</span><span class="commute-mode">${esc(MODE_LABEL[x.mode]||x.mode||"")}</span><span class="commute-time">${esc(Math.round(+x.minutes||0))} 分钟</span></div>`).join("")}</div>${p.tip?`<div class="section"><h2>✨ 碰碰小tip</h2><div class="tip">${esc(p.tip)}</div></div>`:""}<div class="section"><h2>店铺信息</h2><div class="info">${s.hours?`<div>营业时间　${esc(s.hours)}</div>`:""}${s.phone?`<div>联系电话　${esc(s.phone)}</div>`:""}${tags.length?`<div class="tags">${tags.slice(0,4).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>`:""}</div></div><a class="nav" href="${nav}" target="_blank" rel="noopener">在地图中查看</a><div class="foot">碰碰 · 想见，那就轻松碰一面</div></section>`}
const raw=location.hash.startsWith("#/share/")?location.hash.slice(8):location.hash.replace(/^#/,"");const p=parse(raw);if(valid(p))render(p);else document.getElementById("app").innerHTML='<section class="invalid"><h1>这份会面提案链接无效或不完整</h1><p>请让碰友重新分享一次，或检查链接是否被聊天软件截断。</p></section>';
</script></body></html>
